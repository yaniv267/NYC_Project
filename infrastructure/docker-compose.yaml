version: '3.2'
services:

  zookeeper:
    container_name: zookeeper
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"

  course-kafka:
    container_name: course-kafka
    image: wurstmeister/kafka:2.13-2.8.1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
     
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://course-kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  kafdrop:
    container_name: kafdrop
    image: obsidiandynamics/kafdrop:latest
    ports:
      - "9003:9000"
    environment:
    
      KAFKA_BROKERCONNECT: course-kafka:9093
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - course-kafka

  minio:
        container_name: minio
        image: minio/minio:RELEASE.2022-11-08T05-27-07Z
        command: server /data --console-address ":9001"
        ports:
            - "9001:9000"
            - "9002:9001"
    # הוסף את החלק הזה:
        volumes:
          - ./minio_storage:/data
  dev_env:
        container_name: dev_env
        image: ofrir119/developer_env:spark340_ssh
        ports:
            - "22022:22"
            - "8888:8888"
            - "4040:4040"
            - "4041:4041"
            - "4042:4042"
        volumes:
          - ./spark-course-python:/home/developer/projects/spark-course-python
        dns:
          - 8.8.8.8
          - 1.1.1.1
        logging:
          driver: gelf
          options:
            gelf-address: "udp://localhost:12201"
            tag: "spark-job"
  elasticsearch:

    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.2
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:7.13.2
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:7.13.2
    volumes:
      - ./pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "12201:12201/udp"
    depends_on:
      - elasticsearch

  postgres:
        container_name: postgres
        image: postgres:12
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=airflow
            - POSTGRES_PORT=5432
        volumes:
          # השורה הזו אומרת לדוקר: "קח את הסקריפט שלי ותריץ אותו כשהדאטה-בייס עולה"
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "5433:5432"
  airflow-init:
    build: .
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python requests
    volumes:
      - ./spark-course-python/spark-kafka-project/Nyc_Project/dags:/opt/airflow/dags
      - ./spark-course-python/spark-kafka-project/Nyc_Project/src:/opt/airflow/src
      - ./airflow-data/logs:/opt/airflow/logs
      - ./airflow-data/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow users list || ( airflow db init && airflow users create --role Admin --username airflow --password airflow --email airflow@airflow.com --firstname airflow --lastname airflow )"
    restart: on-failure

  airflow-webserver:
    build: .
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python requests
    volumes:
      - ./spark-course-python/spark-kafka-project/Nyc_Project/dags:/opt/airflow/dags
      - ./spark-course-python/spark-kafka-project/Nyc_Project/src:/opt/airflow/src
      - ./airflow-data/logs:/opt/airflow/logs
      - ./airflow-data/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - postgres
    command: airflow webserver
    ports:
      - "8082:8080"
    container_name: airflow_webserver
    restart: always

  airflow-scheduler:
    build: .
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python requests
    volumes:
      - ./spark-course-python/spark-kafka-project/Nyc_Project/dags:/opt/airflow/dags
      - ./spark-course-python/spark-kafka-project/Nyc_Project/src:/opt/airflow/src
      - ./airflow-data/logs:/opt/airflow/logs
      - ./airflow-data/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - postgres
    command: airflow scheduler
    container_name: airflow_scheduler
    restart: always

networks:
  data-network:
    driver: bridge
